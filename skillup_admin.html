<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillUp CRM — لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--rose:#f472b6;--lilac:#c084fc;--purple:#a855f7;--dark:#0a0612;--dark2:#120a1e;--card:#160e24;--bdr:rgba(192,132,252,.15);--tx:#fdf0f8;--tx2:#c4a8d4;--tx3:#7a5a8a;--green:#34d399;--red:#f87171;--yellow:#fbbf24;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--dark);color:var(--tx);min-height:100vh;}
.topbar{background:var(--dark2);border-bottom:1px solid var(--bdr);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--rose),var(--lilac));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.admin-badge{background:rgba(244,114,182,.15);border:1px solid rgba(244,114,182,.3);color:var(--rose);font-size:12px;font-weight:700;padding:4px 14px;border-radius:20px;}
.logout-btn{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red);font-size:13px;font-weight:600;padding:7px 18px;border-radius:20px;cursor:pointer;font-family:'Tajawal',sans-serif;}
.main{padding:32px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:20px;}
.stat-num{font-size:36px;font-weight:900;}
.stat-lbl{font-size:13px;color:var(--tx2);margin-top:4px;}
.s-rose{color:var(--rose);}
.s-green{color:var(--green);}
.s-yellow{color:var(--yellow);}
.s-red{color:var(--red);}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:24px;margin-bottom:24px;}
.card-title{font-size:16px;font-weight:700;color:var(--rose);margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.search-row{display:flex;gap:12px;margin-bottom:18px;}
.search-row input,.search-row select{background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:10px;color:var(--tx);font-size:14px;padding:10px 14px;font-family:'Tajawal',sans-serif;outline:none;}
.search-row input{flex:1;}
.search-row input:focus,.search-row select:focus{border-color:var(--rose);}
.search-row select option{background:var(--dark2);}
table{width:100%;border-collapse:collapse;}
th{text-align:right;padding:12px 16px;font-size:12px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bdr);white-space:nowrap;}
td{padding:13px 16px;font-size:14px;border-bottom:1px solid rgba(192,132,252,.06);}
tr:hover td{background:rgba(255,255,255,.02);}
.plan-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;}
.plan-basic{background:rgba(192,132,252,.12);color:var(--lilac);border:1px solid rgba(192,132,252,.3);}
.plan-pro{background:rgba(244,114,182,.12);color:var(--rose);border:1px solid rgba(244,114,182,.3);}
.plan-enterprise{background:rgba(251,191,36,.12);color:var(--yellow);border:1px solid rgba(251,191,36,.3);}
.status-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;}
.status-active{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.3);}
.status-trial{background:rgba(251,191,36,.12);color:var(--yellow);border:1px solid rgba(251,191,36,.3);}
.status-inactive{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.3);}
.action-btn{font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;cursor:pointer;border:none;font-family:'Tajawal',sans-serif;transition:all .2s;}
.btn-activate{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.3);}
.btn-activate:hover{background:rgba(52,211,153,.3);}
.btn-deactivate{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.3);}
.btn-deactivate:hover{background:rgba(248,113,113,.25);}
.btn-change-plan{background:rgba(192,132,252,.12);color:var(--lilac);border:1px solid rgba(192,132,252,.3);}
.btn-change-plan:hover{background:rgba(192,132,252,.25);}
.actions{display:flex;gap:6px;flex-wrap:wrap;}
.empty{text-align:center;padding:48px;color:var(--tx3);}
.loading{text-align:center;padding:48px;color:var(--tx3);}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;}
.mo.open{display:flex;}
.modal{background:var(--dark2);border:1px solid var(--bdr);border-radius:20px;padding:28px;width:90%;max-width:460px;}
.modal h3{font-size:17px;font-weight:800;color:var(--rose);margin-bottom:20px;}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:13px;color:var(--tx2);margin-bottom:7px;font-weight:600;}
.fg select,.fg input{width:100%;padding:11px 14px;background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:10px;color:var(--tx);font-size:14px;font-family:'Tajawal',sans-serif;outline:none;}
.fg select:focus,.fg input:focus{border-color:var(--rose);}
.fg select option{background:var(--dark2);}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.btn{padding:10px 20px;border-radius:30px;font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;}
.btn-cancel{background:rgba(255,255,255,.05);border:1px solid var(--bdr);color:var(--tx2);}
.btn-confirm{background:linear-gradient(135deg,var(--rose),var(--purple));color:#fff;border:none;box-shadow:0 4px 16px rgba(244,114,182,.3);}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:36px;width:100%;max-width:380px;text-align:center;}
.login-box h2{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--rose),var(--lilac));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.login-box p{font-size:13px;color:var(--tx3);margin-bottom:24px;}
.login-box input{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:10px;color:var(--tx);font-size:14px;font-family:'Tajawal',sans-serif;outline:none;margin-bottom:14px;}
.login-box input:focus{border-color:var(--rose);}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--rose),var(--purple));color:#fff;font-weight:700;font-size:15px;border:none;border-radius:10px;cursor:pointer;font-family:'Tajawal',sans-serif;}
.err-msg{color:var(--red);font-size:13px;margin-top:10px;}
/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 22px;border-radius:30px;font-size:14px;z-index:9999;opacity:0;transition:opacity .28s;pointer-events:none;font-family:Tajawal,sans-serif;background:#1a1a24;border:1px solid #2a2a3a;white-space:nowrap;}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <div style="font-size:48px;margin-bottom:12px;">🔐</div>
    <h2>لوحة الإدارة</h2>
    <p>SkillUp CRM — للمدير فقط</p>
    <input type="password" id="admin-pw" placeholder="كلمة مرور المدير" onkeydown="if(event.key==='Enter')adminLogin()">
    <button class="login-btn" onclick="adminLogin()">دخول</button>
    <div class="err-msg" id="login-err"></div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel" style="display:none">
  <div class="topbar">
    <div class="logo">SkillUp CRM</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="admin-badge">🛡️ لوحة الإدارة</span>
      <button class="logout-btn" onclick="adminLogout()">خروج</button>
    </div>
  </div>

  <div class="main">
    <!-- STATS -->
    <div class="stats" id="stats-grid">
      <div class="stat"><div class="stat-num s-rose" id="st-total">-</div><div class="stat-lbl">إجمالي المستخدمين</div></div>
      <div class="stat"><div class="stat-num s-green" id="st-active">-</div><div class="stat-lbl">✅ نشطون</div></div>
      <div class="stat"><div class="stat-num s-yellow" id="st-trial">-</div><div class="stat-lbl">⏳ تجريبي</div></div>
      <div class="stat"><div class="stat-num s-red" id="st-inactive">-</div><div class="stat-lbl">❌ منتهي</div></div>
    </div>

    <!-- USERS TABLE -->
    <div class="card">
      <div class="card-title">👥 المستخدمون</div>
      <div class="search-row">
        <input type="text" id="search-input" placeholder="ابحث بالإيميل أو اسم النشاط..." oninput="filterUsers()">
        <select id="filter-plan" onchange="filterUsers()">
          <option value="">كل الخطط</option>
          <option value="basic">أساسي</option>
          <option value="pro">احترافي</option>
          <option value="enterprise">شركات</option>
        </select>
        <select id="filter-status" onchange="filterUsers()">
          <option value="">كل الحالات</option>
          <option value="active">نشط</option>
          <option value="trial">تجريبي</option>
          <option value="inactive">منتهي</option>
        </select>
        <button class="action-btn btn-activate" onclick="loadUsers()" style="white-space:nowrap">🔄 تحديث</button>
      </div>
      <div id="users-table">
        <div class="loading">⏳ جاري التحميل...</div>
      </div>
    </div>
  </div>
</div>

<!-- PLAN MODAL -->
<div class="mo" id="plan-modal">
  <div class="modal">
    <h3>✏️ تعديل المستخدم</h3>
    <input type="hidden" id="edit-uid">
    <div class="fg">
      <label>اسم النشاط التجاري</label>
      <input type="text" id="edit-biz" readonly style="opacity:.6">
    </div>
    <div class="fg">
      <label>الخطة</label>
      <select id="edit-plan">
        <option value="basic">🌸 أساسي — 15 ر.ع</option>
        <option value="pro">💜 احترافي — 35 ر.ع</option>
        <option value="enterprise">🏢 شركات — 80 ر.ع</option>
      </select>
    </div>
    <div class="fg">
      <label>الحالة</label>
      <select id="edit-status">
        <option value="true">✅ نشط</option>
        <option value="false">❌ موقوف</option>
      </select>
    </div>
    <div class="fg">
      <label>تاريخ انتهاء الاشتراك</label>
      <input type="date" id="edit-expiry">
    </div>
    <div class="fg">
      <label>ملاحظة الدفع (اختياري)</label>
      <input type="text" id="edit-note" placeholder="مثال: دفع عبر تحويل بنكي">
    </div>
    <div class="modal-acts">
      <button class="btn btn-cancel" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-confirm" onclick="saveUser()">💾 حفظ</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── CONFIG ──
var SUPA_URL     = 'https://kgqmbegbmefftgstkizp.supabase.co';
var SUPA_ANON    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtncW1iZWdibWVmZnRnc3RraXpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NjA0MzEsImV4cCI6MjA5MzMzNjQzMX0.bKZMer5IaLzjtGYS5i_9VWoqn-tUAuCSCY_Ba7sH5h4';
var SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtncW1iZWdibWVmZnRnc3RraXpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NjA0MzEsImV4cCI6MjA5MzMzNjQzMX0.bKZMer5IaLzjtGYS5i_9VWoqn-tUAuCSCY_Ba7sH5h4';

// Admin password — change this to something strong!
var ADMIN_PASSWORD = 'skillup@2025';

var allUsers = [];
var adminToken = null;

// ── ADMIN LOGIN ──
function adminLogin() {
  var pw = document.getElementById('admin-pw').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display  = 'block';
    sessionStorage.setItem('admin_auth', '1');
    loadUsers();
  } else {
    document.getElementById('login-err').textContent = '❌ كلمة المرور غير صحيحة';
  }
}

function adminLogout() {
  sessionStorage.removeItem('admin_auth');
  location.reload();
}

// Check if already logged in
if (sessionStorage.getItem('admin_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-panel').style.display  = 'block';
  loadUsers();
}

// ── LOAD USERS ──
async function loadUsers() {
  document.getElementById('users-table').innerHTML = '<div class="loading">⏳ جاري التحميل...</div>';
  try {
    // Use RPC function (no service role needed)
    var res = await fetch('https://kgqmbegbmefftgstkizp.supabase.co/rest/v1/rpc/get_all_profiles', {
      method: 'POST',
      headers: {
        'apikey': SUPA_ANON,
        'Authorization': 'Bearer ' + SUPA_ANON,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({})
    });
    var profiles = await res.json();
    if (!Array.isArray(profiles)) throw new Error('يرجى تشغيل admin_fix.sql أولاً في Supabase');

    // Emails not available without service role - show profile data only
    var authUsers = [];

    // Map profiles
    allUsers = profiles.map(function(p) {
      var now = new Date();
      var trialEnd = p.trial_end ? new Date(p.trial_end) : null;
      var status = !p.is_active ? 'inactive' : (trialEnd && trialEnd < now ? 'inactive' : (trialEnd && (trialEnd - now) < 14*86400000 ? 'trial' : 'active'));
      return {
        id:        p.id,
        email:     p.id.substring(0,8) + '...',
        biz:       p.business_name || '—',
        plan:      p.plan || 'basic',
        is_active: p.is_active,
        trial_end: p.trial_end,
        created:   p.created_at,
        status:    status,
        note:      p.payment_note || '',
      };
    });

    updateStats();
    renderTable(allUsers);
  } catch(e) {
    document.getElementById('users-table').innerHTML = '<div class="empty">❌ خطأ: ' + e.message + '<br><small>تأكد من إضافة Service Role Key</small></div>';
  }
}

function updateStats() {
  var total    = allUsers.length;
  var active   = allUsers.filter(function(u){return u.status==='active';}).length;
  var trial    = allUsers.filter(function(u){return u.status==='trial';}).length;
  var inactive = allUsers.filter(function(u){return u.status==='inactive';}).length;
  document.getElementById('st-total').textContent    = total;
  document.getElementById('st-active').textContent   = active;
  document.getElementById('st-trial').textContent    = trial;
  document.getElementById('st-inactive').textContent = inactive;
}

function renderTable(users) {
  if (!users.length) {
    document.getElementById('users-table').innerHTML = '<div class="empty">لا يوجد مستخدمون</div>';
    return;
  }
  var planNames = {basic:'أساسي', pro:'احترافي', enterprise:'شركات'};
  var statusNames = {active:'نشط', trial:'تجريبي', inactive:'منتهي'};
  var html = '<table><thead><tr>' +
    '<th>النشاط التجاري</th><th>الإيميل</th><th>الخطة</th><th>الحالة</th><th>انتهاء الاشتراك</th><th>الإجراءات</th>' +
    '</tr></thead><tbody>';
  users.forEach(function(u) {
    var expiry = u.trial_end ? new Date(u.trial_end).toLocaleDateString('ar-OM') : '—';
    html += '<tr>';
    html += '<td><strong>' + u.biz + '</strong></td>';
    html += '<td style="color:var(--tx2);font-size:13px;">' + u.email + '</td>';
    html += '<td><span class="plan-badge plan-' + u.plan + '">' + planNames[u.plan] + '</span></td>';
    html += '<td><span class="status-badge status-' + u.status + '">' + statusNames[u.status] + '</span></td>';
    html += '<td style="font-size:13px;color:var(--tx2);">' + expiry + '</td>';
    html += '<td><div class="actions">';
    if (u.status !== 'active') {
      html += '<button class="action-btn btn-activate" onclick="quickActivate(\'' + u.id + '\')">✅ تفعيل شهر</button>';
    } else {
      html += '<button class="action-btn btn-deactivate" onclick="quickDeactivate(\'' + u.id + '\')">❌ إيقاف</button>';
    }
    html += '<button class="action-btn btn-change-plan" onclick="openEdit(\'' + u.id + '\')">✏️ تعديل</button>';
    html += '</div></td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('users-table').innerHTML = html;
}

// ── FILTER ──
function filterUsers() {
  var search = document.getElementById('search-input').value.toLowerCase();
  var plan   = document.getElementById('filter-plan').value;
  var status = document.getElementById('filter-status').value;
  var filtered = allUsers.filter(function(u) {
    return (!search || u.email.toLowerCase().includes(search) || u.biz.toLowerCase().includes(search))
        && (!plan   || u.plan === plan)
        && (!status || u.status === status);
  });
  renderTable(filtered);
}

// ── QUICK ACTIONS ──
async function quickActivate(uid) {
  var next = new Date();
  next.setMonth(next.getMonth() + 1);
  await updateProfile(uid, { is_active: true, trial_end: next.toISOString() });
  toast('✅ تم تفعيل الحساب لمدة شهر');
  loadUsers();
}

async function quickDeactivate(uid) {
  if (!confirm('هل تريد إيقاف هذا الحساب؟')) return;
  await updateProfile(uid, { is_active: false });
  toast('❌ تم إيقاف الحساب');
  loadUsers();
}

// ── EDIT MODAL ──
function openEdit(uid) {
  var u = allUsers.find(function(x){ return x.id === uid; });
  if (!u) return;
  document.getElementById('edit-uid').value    = uid;
  document.getElementById('edit-biz').value    = u.biz;
  document.getElementById('edit-plan').value   = u.plan;
  document.getElementById('edit-status').value = u.is_active ? 'true' : 'false';
  document.getElementById('edit-note').value   = u.note || '';
  var expiry = u.trial_end ? u.trial_end.split('T')[0] : '';
  document.getElementById('edit-expiry').value = expiry;
  document.getElementById('plan-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('plan-modal').classList.remove('open');
}

async function saveUser() {
  var uid    = document.getElementById('edit-uid').value;
  var plan   = document.getElementById('edit-plan').value;
  var active = document.getElementById('edit-status').value === 'true';
  var expiry = document.getElementById('edit-expiry').value;
  var note   = document.getElementById('edit-note').value;
  var data   = { plan, is_active: active };
  if (expiry) data.trial_end = new Date(expiry).toISOString();
  if (note)   data.payment_note = note;
  await updateProfile(uid, data);
  closeModal();
  toast('💾 تم الحفظ بنجاح');
  loadUsers();
}

// ── UPDATE PROFILE ──
async function updateProfile(uid, data) {
  await fetch('https://kgqmbegbmefftgstkizp.supabase.co/rest/v1/rpc/admin_update_profile', {
    method: 'POST',
    headers: {
      'apikey': SUPA_ANON,
      'Authorization': 'Bearer ' + SUPA_ANON,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      p_id:           uid,
      p_plan:         data.plan         || null,
      p_is_active:    data.is_active    !== undefined ? data.is_active : null,
      p_trial_end:    data.trial_end    || null,
      p_payment_note: data.payment_note || null
    })
  });
}

// ── TOAST ──
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  el.style.color = '#34d399';
  el.style.borderColor = 'rgba(52,211,153,.4)';
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.style.opacity='0'; }, 2800);
}
</script>
</body>
</html>
